<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef7e7">
  <meta name="description" content="Open a Frog Planter friend invitation.">
  <title>Frog Planter Invite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="card">
    <div class="frog" aria-hidden="true">🐸</div>
    <p class="eyebrow">FROG PLANTER</p>
    <h1>You’ve been invited!</h1>
    <p class="lead">
      A Frog Planter player wants to add you as a friend.
    </p>

    <div id="inviteBox" class="invite-box" hidden>
      <span>Invite code</span>
      <strong id="inviteCode"></strong>
    </div>

    <p id="status" class="status">
      If Frog Planter is installed, this link should open the game automatically.
    </p>

    <div class="actions">
      <a id="storeButton" class="button primary" href="#" hidden>Get Frog Planter</a>
      <button id="copyButton" class="button secondary" type="button" hidden>Copy invite link</button>
    </div>

    <p class="small">
      Don’t share invitation links publicly. Each invite should be generated by Frog Planter.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
